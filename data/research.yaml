intro: The convergence of edge computing and AI is driven by the unique advantages of edge computing, including low latency, enhanced privacy, and personalized intelligence. However, Edge AI systems typically operate in environments that are constrained, distributed, heterogeneous, and dynamic. My vision is to build efficient, scalable, adaptive, and autonomous Edge AI systems for real-world edge applications.
keywords:
  - Agentic Edge AI
  - Edge Computing
  - Federated Learning
  - Model Compression
