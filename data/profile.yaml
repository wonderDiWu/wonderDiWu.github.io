pageTitle: Di Wu / 吴迪 | Lecturer | Zhejiang University of Technology
pageDescription: Di Wu (吴迪), Lecturer at the College of Information Engineering, Zhejiang University of Technology, researching Edge AI Systems Optimization with a focus on Agentic Edge AI.
hero:
  name: Di Wu / 吴迪
