  bio: I'm a Research Fellow at the University of St Andrews and UK National Edge AI Hub, where I work on next-generation Edge AI systems. I completed my PhD in Computer Science at the University of St Andrews in 2024 with a doctoral thesis titled Distributed Machine Learning on Edge Computing Systems. Before pursuing a career in research, I worked as an AI Engineer in industry, developing model compression techniques for the efficient deployment of AI models on edge devices.
