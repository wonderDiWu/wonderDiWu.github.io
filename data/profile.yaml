  photoAlt: Portrait of Di Wu
  bio: I am a Lecturer at the College of Information Engineering, Zhejiang University of Technology. My research focuses on Edge AI Systems Optimization, with Agentic Edge AI as a key direction. Previously, I was a Research Fellow at the University of St Andrews, contributing to the UKRI National Edge AI Hub. I received my PhD in Computer Science from the University of St Andrews in 2024, with the thesis Distributed Machine Learning on Edge Computing Systems. Earlier, I worked as an AI Engineer in industry on model compression and efficient model deployment on edge devices.
